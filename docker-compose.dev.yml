services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muxivo_console
      POSTGRES_USER: muxivo
      POSTGRES_PASSWORD: muxivo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muxivo -d muxivo_console"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - muxivo-console-dev-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .dev/console.env
    environment:
      # Development exercises the same shared Redis boundary used by
      # production for rate limits and one-time authentication state.
      MUXIVO_CONSOLE_RATE_LIMIT_BACKEND: redis
      MUXIVO_CONSOLE_RATE_LIMIT_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)\"",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  muxivo-console-dev-postgres:
