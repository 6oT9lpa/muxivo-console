services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./deploy/prometheus-console.dev.yml.example:/etc/prometheus/prometheus.yml:ro
      - ./docs/operations/prometheus-alerts.yml:/etc/prometheus/rules/muxivo-console-alerts.yml:ro
      - muxivo-console-dev-prometheus:/prometheus
    depends_on:
      api:
        condition: service_healthy

volumes:
  muxivo-console-dev-prometheus:
