name: Console Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: console-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint backend
        run: python -m ruff check .

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Check application and settings class layout
        run: python scripts/application_class_layout_check.py

      - name: Scan for committed secrets
        run: python scripts/secret_scan.py

      - name: Prevent removed legacy registration flows
        run: python scripts/legacy_auth_scan.py

      - name: Scan browser-facing contracts for platform tokens
        run: python scripts/browser_token_exposure_scan.py

      - name: Review audit coverage
        run: python scripts/audit_coverage.py

      - name: Validate production readiness artifacts
        run: python scripts/readiness_artifact_check.py

      - name: Test Discord and Twitch Control API contracts
        run: >-
          python -m pytest
          tests/unit/test_discord_control_api.py
          tests/unit/test_twitch_control_api.py
          -q

      - name: Test security regression contracts
        run: >-
          python -m pytest
          tests/api/test_security_headers_api.py
          tests/unit/test_secret_redaction.py
          tests/unit/test_browser_token_exposure_scan.py
          -q

      - name: Smoke production composition
        run: python scripts/production_composition_smoke.py

      - name: Test backend
        run: python -m pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Test frontend E2E
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

  migration-rollback:
    name: Migration rollback smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: muxivo_console
          POSTGRES_USER: muxivo
          POSTGRES_PASSWORD: muxivo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muxivo -d muxivo_console"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Upgrade, rollback and re-upgrade migrations
        env:
          MUXIVO_CONSOLE_DATABASE_URL: postgresql+asyncpg://muxivo:muxivo@127.0.0.1:5432/muxivo_console
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  composition-smoke:
    name: Development Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run development Docker Compose smoke
        run: python scripts/development_composition_smoke.py

  observability-composition-smoke:
    name: Development observability composition smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run API and Prometheus composition smoke
        run: python scripts/observability_composition_smoke.py
